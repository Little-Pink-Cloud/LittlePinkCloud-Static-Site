<!-- ========================= -->
<!-- ⭐ Reusable Carousel Block -->
<!-- ========================= -->
<div class="carousel" data-carousel>

  <!-- Prev Button -->
  <button class="carousel-btn prev" data-carousel-prev>❮</button>

  <!-- Track -->
  <div class="carousel-track" data-carousel-track>

    <!-- Slide 1 -->
    <div class="carousel-slide active" data-caption="Your caption for slide 1">
      <img src="PATH/TO/IMAGE-1.png" alt="Screenshot 1">
    </div>

    <!-- Slide 2 -->
    <div class="carousel-slide" data-caption="Your caption for slide 2">
      <img src="PATH/TO/IMAGE-2.png" alt="Screenshot 2">
    </div>

    <!-- Slide 3 -->
    <div class="carousel-slide" data-caption="Your caption for slide 3">
      <img src="PATH/TO/IMAGE-3.png" alt="Screenshot 3">
    </div>

  </div>

  <!-- Next Button -->
  <button class="carousel-btn next" data-carousel-next>❯</button>

  <!-- Dots -->
  <div class="carousel-dots" data-carousel-dots></div>

  <!-- Caption -->
  <div class="carousel-caption-below" data-carousel-caption></div>

</div>
